---
mountOptions:
    default: defaults,noatime
    btrfs: defaults,noatime,compress=zstd:4

ssdExtraMountOptions:
    ext4: discard
    jfs: discard
    xfs: discard
    swap: discard
    btrfs: ssd,discard=async
crypttabOptions: luks,discard,keyscript=/bin/cat

tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: false
        options: ""
