---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - dialout
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: true
SetRootPasswordCheck: true # Prueva para saber si ese es el valor real
passwordRequirements:
    nonempty: true
    minLength: 4  # Password at least this many characters
    maxLength: 100  # Password at most this many characters

